name: Build

on:
  push:
    branches-ignore: [lint-scan]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vigil-mod
          path: build/libs/vigil-*.jar
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            build/reports

  gametest:
    # Boots a real headless Minecraft server with the mod and runs the in-game tests.
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run game tests on a headless server
        run: |
          chmod +x gradlew
          ./gradlew runGametest 2>&1 | tee gametest.log
          exit ${PIPESTATUS[0]}
      - name: Show mixin and mod errors
        if: always()
        run: grep -nE "Mixin|mixin|ERROR|Exception|vigil|Vigil" gametest.log | grep -vE "^\s*$" | head -200 || true
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            gametest.log
            build/gametest/logs
            build/gametest/junit.xml
