name: Version probe
on:
  push:
    branches: [claude/version-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versions
        run: |
          echo "== yarn 1.21.11"; curl -s https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0:2][] .version'
          echo "== loom 1.1x releases"
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oE '<version>1\.1[2-8]\.[0-9]+</version>' | sed 's/<[^>]*>//g' | sort -V | awk -F. '{k=$1"."$2; last[k]=$0} END {for (k in last) print last[k]}' | sort -V
          echo "== plugin markers"
          for id in fabric-loom net.fabricmc.fabric-loom net.fabricmc.fabric-loom-remap; do
            echo "$id: $(curl -s https://maven.fabricmc.net/$(echo $id | tr . /)/$id.gradle.plugin/maven-metadata.xml | grep -oE '<version>1\.1[4-8]\.[0-9]+</version>' | sed 's/<[^>]*>//g' | tail -3 | tr '\n' ' ')"
          done
          echo "== gradle versions"; curl -s https://services.gradle.org/versions/all | jq -r '[.[] | select(.snapshot==false and .nightly==false and .rcFor=="" and .milestoneFor=="")][0:12][] .version' | tr '\n' ' '
