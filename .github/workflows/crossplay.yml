# End-to-end crossplay test: a server set up like scripts/oracle-setup.sh (mod, Floodgate, ViaFabric + newest
# ViaVersion) behind the newest Geyser, and a fake player on the newest Bedrock version joins it.
name: Crossplay
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  bedrock-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build mod
        run: ./gradlew build -x test -x :core:test --no-daemon -q
      - name: Server like the Oracle one
        run: |
          mkdir -p srv/mods && cd srv
          L=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader/1.21.11 | jq -r '[.[]|select(.loader.stable)][0].loader.version')
          I=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '[.[]|select(.stable)][0].version')
          curl -fsSL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.11/$L/$I/server/jar"
          get() { curl -fsSL -G "https://api.modrinth.com/v2/project/$1/version" --data-urlencode 'loaders=["fabric"]' $2 | jq -r '.[0].files[]|select(.primary).url'; }
          V='--data-urlencode game_versions=["1.21.11"]'
          curl -fsSL -o mods/fabric-api.jar "$(get fabric-api "$V")"
          curl -fsSL -o mods/floodgate.jar "$(get floodgate "$V")"
          curl -fsSL -o mods/viafabric.jar "$(get viafabric "$V")"
          curl -fsSL -o mods/viaversion.jar "$(get viaversion)"
          curl -fsSL -o mods/viabackwards.jar "$(get viabackwards)"
          cp ../build/libs/$(ls ../build/libs | grep -v sources | head -1) mods/vigil.jar
          ls mods
          echo eula=true > eula.txt
          printf 'online-mode=false\nenforce-secure-profile=false\nenable-rcon=true\nrcon.port=25575\nrcon.password=crossplay\n' > server.properties
          ln -sfn "$PWD" ~/mc
          # The Bedrock bot is the owner (no PIN) so it can open the Vigil menus.
          mkdir -p config/vigil && echo '{"general":{"ownerName":"BedrockBot"},"staff":{"requirePin":false},"watcher":{"warnOnJoin":false}}' > config/vigil/config.json
          nohup java -Xmx3G -jar server.jar nogui > run.log 2>&1 < /dev/null &
          for i in $(seq 1 150); do grep -q 'Done (' run.log && break; grep -q 'Failed to start' run.log && break; sleep 2; done
          grep -E "Done \(|Failed|Caused by" run.log | head; grep -q 'Done (' run.log
          ls config/floodgate
      - name: Newest Geyser standalone
        run: |
          mkdir geyser && cd geyser
          curl -fsSL -o Geyser.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/standalone
          cp ../srv/config/floodgate/key.pem key.pem
          nohup java -Xmx1G -jar Geyser.jar --nogui > geyser.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do [ -f config.yml ] && break; sleep 2; done
          pkill -f Geyser.jar || true; sleep 3
          sed -i 's/auth-type: .*/auth-type: floodgate/; s/address: auto/address: 127.0.0.1/' config.yml
          grep -q "validate-bedrock-login" config.yml && sed -i 's/validate-bedrock-login: .*/validate-bedrock-login: false/' config.yml || echo "validate-bedrock-login: false" >> config.yml
          grep -nE "auth-type|address|port|validate" config.yml | head
          nohup java -Xmx1G -jar Geyser.jar --nogui > geyser.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do grep -qi "Done (" geyser.log && break; sleep 2; done
          tail -n 15 geyser.log
          grep -i "Done (" geyser.log
          grep -iE "supported|bedrock version|minecraft version" geyser.log | head -5 || true
      - name: Fake Bedrock player joins through Geyser
        run: |
          mkdir bot && cd bot && npm init -y >/dev/null && npm i bedrock-protocol@latest >/dev/null 2>&1
          node -e "const v=require('bedrock-protocol/package.json').version;const d=require('minecraft-data');console.log('bedrock-protocol',v,'latest bedrock',d.versions.bedrock[0].minecraftVersion)"
          cat > bot.js <<'JS'
          const bedrock = require('bedrock-protocol')
          const { execSync } = require('child_process')
          const sleep = (ms) => new Promise(r => setTimeout(r, ms))
          const mc = (c) => { try { console.log('RCON', c, '->', execSync('python3 ../scripts/mc ' + c).toString().trim()) } catch (e) { console.log('RCON failed', c, e.message) } }
          const client = bedrock.createClient({ host: '127.0.0.1', port: 19132, username: 'BedrockBot', offline: true, skipPing: false })
          let figures = 0, removed = 0, containers = 0, items = 0, forms = 0, menus = 0
          const run = (cmd) => client.queue('command_request', { command: cmd, origin: { type: 'player', uuid: '00000000-0000-0000-0000-000000000000', request_id: '', player_entity_id: 0n }, internal: false, version: '1' })
          client.on('container_open', (p) => { containers++; console.log('BEDROCK container_open:', p.window_type || p.type || JSON.stringify(p).slice(0, 80)) })
          client.on('inventory_content', (p) => { const n = (p.input || []).filter(i => i && i.network_id).length; if (n > 0) { items += n; menus++; console.log('BEDROCK menu items:', n) } })
          client.on('modal_form_request', (p) => { forms++; console.log('BEDROCK form:', String(p.data).slice(0, 120)) })
          client.on('join', () => console.log('BEDROCK: join packet'))
          client.on('add_player', (p) => { figures++; console.log('BEDROCK add_player:', p.username, 'runtime id', String(p.runtime_id)) })
          client.on('remove_entity', () => removed++)
          client.on('text', (p) => console.log('BEDROCK text:', p.message, (p.parameters || []).join(',')))
          client.on('set_title', (p) => console.log('BEDROCK title:', p.type, p.text))
          client.on('spawn', async () => {
            console.log('BEDROCK: spawned in world')
            await sleep(4000)
            // Every Watcher effect through Geyser: the Bedrock client must stay connected through all of them.
            for (const eff of ['turn_around', 'appear', 'doppelganger', 'mirroring', 'rush', 'bedside', 'sign', 'flicker', 'storm',
                               'gift', 'wrong_compass', 'message', 'glitch_text', 'whisper', 'own_voice', 'fake_join', 'footsteps',
                               'silence', 'knocking', 'animals_stare', 'sleep_well', 'jumpscare', 'behind_you', 'closer', 'blackout']) {
              mc('watcher summon BedrockBot ' + eff)
              await sleep(3500)
              mc('watcher off'); mc('watcher on')
              await sleep(500)
            }
            mc('watcher night'); mc('watcher log')
            await sleep(2000)
            // The Vigil menus through Geyser: the panel, settings and the language picker.
            for (const cmd of ['/vigil', '/settings', '/language', '/vigil help']) {
              console.log('BEDROCK runs', cmd)
              run(cmd)
              await sleep(3000)
            }
            console.log('BEDROCK: fake figures seen', figures, 'entities removed', removed, 'windows', containers, 'menus shown', menus, 'menu items', items)
            // Geyser reuses the open window for the next menu, so count the menus whose contents arrived.
            process.exit(figures > 0 && containers >= 1 && menus >= 3 ? 0 : 5)
          })
          client.on('disconnect', (p) => { console.log('BEDROCK disconnected:', JSON.stringify(p)); process.exit(2) })
          client.on('kick', (p) => { console.log('BEDROCK kicked:', JSON.stringify(p)); process.exit(2) })
          client.on('error', (e) => { console.log('BEDROCK error:', e.message); process.exit(3) })
          setTimeout(() => { console.log('BEDROCK: timed out'); process.exit(4) }, 240000)
          JS
          rc=0; node bot.js || rc=$?
          echo "--- server log"; grep -E "BedrockBot|joined the game|lost connection|floodgate|Floodgate|Watcher|Exception" ../srv/run.log | tail -n 40
          echo "--- geyser log"; tail -n 25 ../geyser/geyser.log
          grep -q "joined the game" ../srv/run.log
          exit $rc
