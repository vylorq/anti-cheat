name: API probe
on:
  push:
    branches: [claude/port-1.21.11]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve Minecraft
        run: ./gradlew --no-daemon compileJava -x :core:compileJava > /dev/null 2>&1 || true
      - name: Dump APIs
        run: |
          MC=$(find ~/.gradle/caches -name "minecraft-merged*1.21.11*.jar" ! -name "*sources*" | head -1)
          [ -n "$MC" ] || MC=$(find ~/.gradle/caches .gradle -name "*minecraft*1.21.11*yarn*.jar" ! -name "*sources*" | head -1)
          echo "MC=$MC"
          AUTH=$(find ~/.gradle/caches -name "authlib-*.jar" | head -1)
          FP=$(find ~/.gradle/caches .gradle -name "fabric-events-interaction-v0*.jar" ! -name "*sources*" | head -1)
          GT=$(find ~/.gradle/caches .gradle -name "fabric-gametest-api-v1*.jar" ! -name "*sources*" | head -1)
          AUTH=$(find ~/.gradle/caches -name "authlib-7*.jar" | head -1); [ -n "$AUTH" ] || AUTH=$(find ~/.gradle/caches -name "authlib-*.jar" | sort -V | tail -1)
          CP="$MC:$AUTH:$GT:$FP"
          dump() { echo "#### $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -E "$2" | head -60; }
          echo "#### permission classes"; unzip -l "$MC" | grep -oE "net/minecraft/command/permission/[A-Za-z$]+\.class" | sort -u
          for c in $(unzip -l "$MC" | grep -oE "net/minecraft/command/permission/[A-Za-z]+\.class" | sed 's/\.class//; s#/#.#g'); do dump "$c" 'public'; done
          dump net.minecraft.server.command.ServerCommandSource 'public'
          dump net.minecraft.server.command.CommandManager 'public static'
          dump net.minecraft.world.rule.GameRules 'public [^s]|public static [^f]'
          dump net.minecraft.world.rule.GameRule 'public'
          dump 'net.minecraft.world.WorldProperties$SpawnPoint' 'public'
          dump 'net.minecraft.server.network.ServerPlayerEntity$Respawn' 'public'
          dump net.minecraft.util.ApiServices 'public'
          dump net.minecraft.util.NameToIdCache 'public'
          dump net.minecraft.storage.NbtReadView 'public static'
          dump net.minecraft.storage.NbtWriteView 'public static'
          dump net.minecraft.util.ErrorReporter 'public|static'
          dump net.minecraft.nbt.NbtElement 'asString|toString|String'
          dump net.minecraft.nbt.NbtList 'getCompound|getInt|getString'
          dump net.minecraft.nbt.NbtCompound 'getByte|contains'
          dump net.minecraft.registry.RegistryWrapper\$WrapperLookup 'getOps'
          dump net.minecraft.server.OperatorList 'public'
          dump net.minecraft.server.PlayerManager 'public'
          dump net.minecraft.server.MinecraftServer 'public .*(Pvp|pvp|GameRules|Overworld|getWorld|getSaveProperties|Difficulty|Motd|getOpPermissionLevel|getFunctionPermissionLevel|PermissionLevel)'
          dump net.minecraft.entity.player.PlayerEntity 'Permission|isCreativeLevelTwoOp|getGameProfile|getPlayerConfigEntry'
          dump net.minecraft.world.GameMode 'public [^s]'
          dump net.minecraft.village.VillagerType 'public static'
          dump net.minecraft.registry.Registries 'VILLAGER'
          dump net.fabricmc.fabric.api.entity.FakePlayer 'public'
          dump net.minecraft.server.PlayerConfigEntry 'public'
          dump net.minecraft.util.UserCache 'public'
          echo "#### NameToIdCache"; unzip -l "$MC" | grep -oiE "net/minecraft/[a-z/]*(NameToId|UserCache)[A-Za-z]*\.class"
