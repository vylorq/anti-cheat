name: API probe
on:
  push:
    branches: [claude/watcher]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon compileJava -x :core:compileJava > /dev/null 2>&1 || true
      - name: Dump
        run: |
          MC=$(find ~/.gradle/caches -name "minecraft-merged*1.21.11*.jar" ! -name "*sources*" | head -1)
          AUTH=$(find ~/.gradle/caches -name "authlib-*.jar" | sort -V | tail -1)
          FP=$(find ~/.gradle/caches .gradle -name "fabric-events-interaction-v0*.jar" ! -name "*sources*" | head -1)
          DFU=$(find ~/.gradle/caches -name "datafixerupper*.jar" | head -1); GUAVA=$(find ~/.gradle/caches -name "guava-*.jar" | head -1)
          CP="$MC:$AUTH:$FP:$DFU:$GUAVA"
          d() { echo "#### $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -E "${2:-public}" | grep -vE "toString\(\)|hashCode\(\)|equals\(java" | head -${3:-40}; }
          P=net.minecraft.network.packet.s2c.play
          d $P.PlayerListS2CPacket 'public'
          d "$P.PlayerListS2CPacket\$Entry" 'public'
          d "$P.PlayerListS2CPacket\$Action" 'public static final'
          d $P.PlayerRemoveS2CPacket 'public'
          d $P.EntitySpawnS2CPacket 'public'
          d $P.EntitiesDestroyS2CPacket 'public'
          d $P.EntitySetHeadYawS2CPacket 'public'
          d "$P.EntityS2CPacket\$Rotate" 'public'
          d "$P.EntityS2CPacket\$MoveRelative" 'public'
          d $P.EntityPositionSyncS2CPacket 'public'
          d $P.EntityPositionS2CPacket 'public'
          d net.minecraft.entity.EntityPosition 'public'
          d $P.EntityTrackerUpdateS2CPacket 'public'
          d $P.EntityEquipmentUpdateS2CPacket 'public'
          d $P.EntityAttributesS2CPacket 'public'
          d $P.TeamS2CPacket 'public static|public'
          d $P.BlockUpdateS2CPacket 'public'
          d $P.BlockEntityUpdateS2CPacket 'public'
          d $P.PlaySoundS2CPacket 'public [a-z.]*PlaySoundS2CPacket\('
          d $P.StopSoundS2CPacket 'public'
          d $P.GameStateChangeS2CPacket 'public static final|public'
          d $P.PlayerSpawnPositionS2CPacket 'public'
          d $P.EntityStatusEffectS2CPacket 'public'
          d $P.RemoveEntityStatusEffectS2CPacket 'public'
          d $P.ScreenHandlerSlotUpdateS2CPacket 'public'
          d $P.InventoryS2CPacket 'public'
          d net.minecraft.server.ServerMetadata 'public'
          d net.minecraft.server.MinecraftServer 'Metadata|Motd'
          d net.minecraft.block.entity.SignBlockEntity 'public'
          d net.minecraft.block.entity.SignText 'public'
          d com.mojang.authlib.GameProfile 'public'
          d com.mojang.authlib.properties.PropertyMap 'public' 60
          d com.mojang.authlib.properties.Property 'public'
          d net.minecraft.entity.player.PlayerEntity 'TrackedData|PLAYER_MODE|MODEL'
          d net.minecraft.entity.PlayerLikeEntity 'TrackedData|MODEL' 
          d net.minecraft.entity.attribute.EntityAttributes 'SCALE'
          d net.minecraft.scoreboard.Team 'public [a-z]|public [A-Z]'
          d net.minecraft.scoreboard.AbstractTeam 'public'
          d "net.minecraft.scoreboard.AbstractTeam\$VisibilityRule" 'public static final'
          d net.minecraft.entity.data.DataTracker 'public'
          d "net.minecraft.entity.data.DataTracker\$SerializedEntry" 'public'
          d net.minecraft.entity.Entity 'getDataTracker|FLAGS|getId\(|setHeadYaw|setBodyYaw|refreshPositionAndAngles|setYaw|setPitch|setInvisible|NO_GRAVITY|SILENT'
          d net.minecraft.server.world.ServerWorld 'getLightLevel|isNight|isDay|getTimeOfDay'
          d net.minecraft.world.World 'raycast|isRaining|isThundering|getRainGradient|getThunderGradient|isNight'
          d net.minecraft.entity.LivingEntity 'isSleeping|getSleepingPosition|getAttributeInstance|getEquippedStack'
          d net.minecraft.server.network.ServerPlayerEntity 'getLastAttack|getLastAttackTime|getLastDamage|hurtTime|getPlayerListName|isSleeping'
          d net.minecraft.entity.LivingEntity 'getLastAttackTime|getLastAttacker|lastDamageTaken|getAttacking|hurtTime|getLastAttackedTime'
          d net.minecraft.sound.SoundEvents 'WARDEN|HEARTBEAT|AMBIENT_CAVE|WOODEN_DOOR|STEP|THUNDER|BREATH' 80
          d net.minecraft.entity.EntityType 'PLAYER|MANNEQUIN'
          d net.minecraft.world.WorldProperties 'SpawnPoint|getSpawnPoint'
          d net.fabricmc.fabric.api.entity.FakePlayer 'public static'
          d net.minecraft.network.packet.s2c.play.ChatMessageS2CPacket 'public'
          d net.minecraft.network.packet.s2c.play.ProfilelessChatMessageS2CPacket 'public'
          d net.minecraft.network.message.MessageType 'public static final'
          d net.minecraft.server.network.ServerPlayNetworkHandler 'sendPacket|send\('
          d net.minecraft.block.entity.BlockEntity 'createNbt|toUpdatePacket|getType'
          d net.minecraft.entity.player.PlayerModelPart 'public'
