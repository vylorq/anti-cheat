name: ViaFabric check
on:
  push:
    branches: [claude/viafabric-check]
jobs:
  boot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        via: ["0.4.22+184-1.14-1.21", "0.4.21+181-1.14-1.21", "0.4.21+180-1.14-1.21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Boot a real 1.21.11 Fabric server with the mod + ViaFabric ${{ matrix.via }}
        run: |
          sudo apt-get install -y jq >/dev/null
          ./gradlew build -x test -x :core:test --no-daemon -q
          mkdir -p srv/mods && cd srv
          L=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader/1.21.11 | jq -r '[.[]|select(.loader.stable)][0].loader.version')
          I=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '[.[]|select(.stable)][0].version')
          curl -fsSL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.11/$L/$I/server/jar"
          get() { curl -fsSL -G "https://api.modrinth.com/v2/project/$1/version" --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["1.21.11"]' | jq -r "$2"; }
          curl -fsSL -o mods/fabric-api.jar "$(get fabric-api '.[0].files[]|select(.primary).url')"
          curl -fsSL -o mods/floodgate.jar "$(get floodgate '.[0].files[]|select(.primary).url')"
          VURL=$(get viafabric '.[]|select(.version_number=="${{ matrix.via }}")|.files[]|select(.primary).url')
          echo "ViaFabric url: $VURL"; curl -fsSL -o mods/viafabric.jar "$VURL"
          cp ../build/libs/$(ls ../build/libs | grep -v sources | head -1) mods/anticheat.jar
          echo eula=true > eula.txt
          (timeout 240 java -Xmx2G -jar server.jar nogui > run.log 2>&1 <<< "" &) ; 
          for i in $(seq 1 120); do grep -q 'Done (' run.log && break; grep -q 'Failed to start\|Could not execute entrypoint' run.log && break; sleep 2; done
          grep -E "Done \(|Failed to start|Caused by|ViaVersion|ViaFabric|ERROR" run.log | head -30
          grep -q 'Done (' run.log
